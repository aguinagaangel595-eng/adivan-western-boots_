<body data-page="tienda">
<main id="main" tabindex="-1">
  <section class="page-hero" aria-labelledby="h-tienda">
    <div class="ph-star" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#star"/></svg></div>
    <div class="wrap">
      <p class="label" data-r>Colección</p>
      <h1 id="h-tienda" data-r style="--d:.06s">Tienda</h1>
      <p class="sub" data-r style="--d:.14s">Botas y artículos de piel genuina ADIVAN, hechos a mano uno por uno.</p>
    </div>
  </section>

  <section class="shop-page" aria-label="Catálogo">
    <div class="wrap">
      <div class="filters" id="fGroups" role="group" aria-label="Categorías"></div>
      <div id="fBoots"></div>
      <div class="meta-row">
        <span id="count" aria-live="polite"></span>
        <label class="sr" for="sort">Ordenar por</label>
        <select class="sort" id="sort">
          <option value="default">Ordenar por</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-label="Imagen ampliada" aria-hidden="true">
