<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{HEAD}}
<meta name="theme-color" content="#140d09">
<link rel="icon" type="image/png" href="/assets/favicon-adivan.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/pages.css">
</head>
<body data-page="tienda">
<main id="main" tabindex="-1">
  <section class="page-hero" aria-labelledby="h-page">
    <div class="ph-star" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#star"/></svg></div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Migas de pan"><a href="/">Inicio</a><span>/</span><a href="/tienda">Tienda</a><span>/</span><span aria-current="page">{{LABEL}}</span></nav>
      <h1 id="h-page" data-r style="--d:.06s">{{H1}}</h1>
      <div class="cat-intro" data-r style="--d:.14s">{{INTRO}}</div>
    </div>
  </section>

  <section class="shop-page" aria-label="Productos">
    <div class="wrap">
      <div class="meta-row"><span>{{COUNT}}</span><a class="more-link" href="/tienda" style="margin:0">Ver toda la tienda</a></div>
      <div class="cgrid">{{GRID}}</div>
    </div>
  </section>

  <section class="sec cat-faq" aria-labelledby="h-faq">
    <div class="wrap">
      <h2 id="h-faq" data-r style="font-size:clamp(40px,6vw,84px)">Preguntas frecuentes</h2>
      <div class="qa-list">{{FAQ}}</div>
      <p class="label" style="margin:44px 0 14px">Más categorías</p>
      <div class="cat-links">{{OTRAS}}</div>
    </div>
  </section>
</main>
<script src="/assets/site.js"></script>
</body>
</html>
