<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{HEAD}}
<meta name="theme-color" content="#140d09">
<link rel="icon" type="image/png" href="/assets/favicon-adivan.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/pages.css">
</head>
<body data-page="tienda">
<main id="main" tabindex="-1">
  <section class="p-top">
    <div class="wrap">
      <nav class="crumbs" aria-label="Migas de pan"><a href="/">Inicio</a><span>/</span>{{CRUMB_CAT}}<span>/</span><span aria-current="page">{{CRUMB_NAME}}</span></nav>
      <h1 class="p-h1">{{H1}}{{PARA}}</h1>
      <p class="p-price">{{PRICE}}</p>
    </div>
  </section>

  <section class="p-body">
    <div class="wrap p-grid">
      <div class="p-buy" id="buy" data-pid="{{PID}}">
        <noscript><img src="{{IMG}}" alt="{{ALT}}" style="width:100%;border-radius:16px"><p style="margin-top:14px"><a class="pill" href="https://wa.me/524793203429?text={{WAMSG}}" target="_blank" rel="noopener">Pedir por WhatsApp</a></p></noscript>
      </div>
      <div class="p-info">
        <p class="p-desc">{{DESC}}</p>
        <dl class="p-details">{{DETAILS}}</dl>
        <div class="p-copy">{{COPY}}</div>
        <p class="p-cta"><a class="pill ghost" href="https://wa.me/524793203429?text={{WAMSG}}" target="_blank" rel="noopener">Preguntar por WhatsApp</a> <a class="more-link" href="/tienda">Seguir viendo la tienda</a></p>
      </div>
    </div>
  </section>

  <section class="p-related">
    <div class="wrap">{{RELATED}}</div>
  </section>
</main>
<script src="/assets/products.js"></script>
<script src="/assets/site.js"></script>
<script src="/assets/catalog.js"></script>
<script src="/assets/producto.js"></script>
</body>
</html>
